name: WaveBossy
version: 1.0
main: pl.wavebossy.WaveBossy
api-version: '1.21'
description: System bossow z GUI, animacjami, bossbarami i scoreboardami
commands:
  wavebossy:
    description: Zarzadzanie bossami
    usage: /wavebossy <stworz|lista|edytuj|spawn|reload|pomoc>
    aliases: [wb, bossy]
    permission: wavebossy.admin
    permission-message: Nie masz uprawnien.
permissions:
  wavebossy.admin:
    description: Dostep do komend WaveBossy
    default: op
